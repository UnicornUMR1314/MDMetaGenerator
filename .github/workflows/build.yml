name: build-and-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (vX.Y.Z)
        required: true
        type: string
        default: v1.0.0
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyyaml
      - name: Build exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MDMetaGenerator main.py
      - name: Validate version input
        shell: pwsh
        run: |
          $v='${{ github.event.inputs.version }}'
          if ($v -eq '') { Write-Error 'version input is required'; exit 1 }
          if ($v -notmatch '^v\d+\.\d+\.\d+$') { Write-Error "Invalid version: $v. Expected vX.Y.Z"; exit 1 }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Rename to Chinese
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist'
          $src = Join-Path $dist 'MDMetaGenerator.exe'
          $dstName = 'MD' + [char]0x6587 + [char]0x7AE0 + 'meta' + [char]0x4FE1 + [char]0x606F + [char]0x751F + [char]0x6210 + [char]0x5668 + '.exe'
          if (Test-Path $src) { Rename-Item -LiteralPath $src -NewName $dstName }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}